    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#ukGrad)" stroke="url(#goldUkGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldUkGrad)" stroke-width="0.8" stroke-dasharray="2,2" />
  <!-- Portcullis (Parliament Symbol) -->
  <path d="M38 32 L62 32 L62 58 L38 58 Z" fill="none" stroke="#f5d061" stroke-width="2.5" />
  <line x1="44" y1="32" x2="44" y2="62" stroke="#f5d061" stroke-width="2" />
  <line x1="50" y1="32" x2="50" y2="64" stroke="#f5d061" stroke-width="2" />
  <line x1="56" y1="32" x2="56" y2="62" stroke="#f5d061" stroke-width="2" />
  <line x1="36" y1="40" x2="64" y2="40" stroke="#f5d061" stroke-width="2" />
