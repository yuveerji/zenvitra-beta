name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS (178.93.119.91)
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.VPS_HOST || '178.93.119.91' }}
          username: ${{ secrets.SERVER_USER || secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 10m
          script: |
            bash /var/www/zenvitra/deploy.sh
