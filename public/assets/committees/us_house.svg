  <circle cx="50" cy="50" r="48" fill="url(#houseGrad)" stroke="url(#goldHGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldHGrad)" stroke-width="0.8" stroke-dasharray="2,2" />
