<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="contactBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052019"/>
      <stop offset="50%" stop-color="#0a3227"/>
      <stop offset="100%" stop-color="#02110c"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" fill="url(#contactBg)"/>

  <!-- Architectural Isometric Grid / Lines -->
  <g stroke="#34d399" stroke-width="0.7" stroke-opacity="0.15">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="400" y1="0" x2="400" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
  </g>

  <!-- Envelope / Communications Icon -->
  <g transform="translate(400, 85)">
    <rect x="-35" y="-30" width="70" height="52" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <path d="M-30,-24 L0,2 L30,-24" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="12" r="3" fill="#10b981"/>
  </g>

  <!-- Typography -->
  <text x="400" y="165" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="21" font-weight="800" fill="#ffffff" letter-spacing="3">CONTACT &amp; DIPLOMATIC INQUIRY</text>
  <text x="400" y="190" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0" letter-spacing="2">EXECUTIVE COMMUNIQUÉ &amp; LIAISON</text>
  
  <rect x="1" y="1" width="798" height="238" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
</svg>
