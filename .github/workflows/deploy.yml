name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/zenvitra.xyz/app
            git pull origin main
            
            # Install Node dependencies and rebuild Next.js
            npm install
            npm run build
            
            # Restart Next.js process via PM2
            pm2 restart nextjs-zenvitra || pm2 start npm --name "nextjs-zenvitra" -- start

            # Setup Python Backend environment if backend folder exists
            if [ -d "backend" ]; then
              cd backend
              python3 -m venv venv
              source venv/bin/activate
              pip install -r requirements.txt
              pm2 restart python-zenvitra || pm2 start "uvicorn main:app --port 8000" --name "python-zenvitra"
            fi
            
            pm2 save