  <rect x="53" y="38" width="3" height="16" fill="#f5d061" />
  <rect x="59" y="38" width="3" height="16" fill="#f5d061" />
  <rect x="34" y="54" width="32" height="4" fill="#f5d061" />
  <!-- Text -->
  <path id="houseTextPath" d="M 18 50 A 32 32 0 0 1 82 50" fill="none" />
